# 打包声明 + 依赖列表
# 安装(依赖 + llm_lens 本地包,可编辑模式,改代码立即生效):
#   pip install -e .
# 卸载(只卸 llm-lens 本身,依赖不动;残留的 *.egg-info/ 可手动删):
#   pip uninstall llm-lens
# 查看当前生效的是哪个目录(同一个 Python 环境里同名发行只能装一份,
# 若 clone 了多份各执行过 pip install -e .,则后装的覆盖先装的,只有最后一个生效):
#   pip show llm-lens
#       # 看 "Editable project location" 字段
#   pip list -e
#       # 只列出可编辑安装的包(含普通包时不显示),额外带 "Editable project location" 列
#   python -c "import llm_lens; print(llm_lens.__file__)"
#       # 最可靠:打印实际被导入的模块路径,以真实 import 结果为准

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lens"
version = "0.1.0"
description = "从原理层面 + 开源权重实证理解 LLM 的分析工具库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 数值计算
    "numpy>=1.26",
    # 读取 safetensors 权重
    "safetensors>=0.4",
    # 本地配置文件
    "PyYAML>=6.0",
    # bfloat16 等扩展 dtype 的 numpy 支持(K3 非量化权重为 bf16)
    "ml_dtypes>=0.4",
    # 可视化(夹角分布、奇异值谱等)
    "matplotlib>=3.8",
]

# 可选:torch(CPU 版即可),方便处理 bf16 / 反量化 / 矩阵运算
# 体积较大,按需自行安装:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu

[tool.setuptools.packages.find]
where = ["py-src"]
